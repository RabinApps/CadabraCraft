name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip-ci:
        description: Build the installers without running CI first (a test run; it publishes nothing because it is not a tag)
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  ci:
    if: ${{ !inputs.skip-ci }}
    uses: ./.github/workflows/ci.yml
    with:
      skip-e2e: true # a release gates on lint, typecheck, unit and Rust tests only
  build:
    needs: ci
    # A skipped ci (the skip-ci dispatch input) still builds; a failed or cancelled one does not.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    # Signing and notarization secrets live in the `release` environment.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: kinhin-xcode
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Windows: the NSIS installer (and so the windows-x86_64 updater entry). The signing config is not in this list: the
          # "Windows signing setup" step adds it through WIN_SIGN_CONFIG, and only when the signing secrets are set, so an
          # unsigned dry run needs no Azure account. It is wired but has never signed a file here (docs/release-checklist.md,
          # "Windows signing").
          - os: windows-latest
            args: ""
            rust-targets: ""
          # --verbose: Tauri hides linuxdeploy's own output, so a failed AppImage bundle says nothing without it.
          - os: kinhin-container # arm64: the linux-aarch64 AppImage
            args: --verbose
            rust-targets: ""
          # x86_64: the linux-x86_64 AppImage and updater entry (most Linux desktops). Blacksmith's oldest image keeps the glibc floor low.
          - os: blacksmith-8vcpu-ubuntu-2404
            args: --verbose
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux pnpm deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The standalone pnpm binary needs libatomic; appimagetool needs `file`; an image that already ships them makes this a no-op.
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 binutils file && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: pnpm }
      # After setup-node: the kinhin-container image ships no Node of its own.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs --check "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/cargo-cache
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # libfuse2t64, not libfuse2: Ubuntu 24.04 (Blacksmith's oldest image, so the AppImage's glibc requirement stays low)
          # renamed the package, and 24.04 has no libfuse2.
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libfuse2t64 zlib1g-dev && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Bundled Typst and fonts
        run: bash scripts/fetch-typst.sh ${{ matrix.os == 'kinhin-xcode' && '--all' || '' }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 17 }
      - name: Bundled EPUB checker (EPUBCheck) and its Java runtime
        run: |
          bash scripts/stage-epubcheck.sh
          bash scripts/build-jre.sh ${{ matrix.os == 'kinhin-xcode' && '--all' || '' }}
      - name: Bundled voice engine (sherpa-onnx)
        run: bash scripts/fetch-sherpa.sh ${{ matrix.os == 'kinhin-xcode' && '--all' || '' }}
      - name: MSYS2 toolchain for ffmpeg
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          path-type: inherit
          install: make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Bundled audio encoder (ffmpeg)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-ffmpeg.sh ${{ matrix.os == 'kinhin-xcode' && '--all' || '' }}
      - name: Bundled audio encoder (ffmpeg, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/fetch-ffmpeg.sh
      # Artifact Signing (formerly Trusted Signing). Only the endpoint, account and certificate profile are needed; the
      # signing tool authenticates with the credentials the job sets up out of band (docs/release-checklist.md,
      # "Windows signing"). A tagged release refuses to build without them, so a published installer is never silently
      # unsigned; a dry run without them builds and says so.
      - name: Windows signing setup
        if: runner.os == 'Windows'
        shell: bash
        env:
          ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          CLI_VERSION: ${{ vars.ARTIFACT_SIGNING_CLI_VERSION }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            missing=""
            [ -n "$ENDPOINT" ] || missing="$missing AZURE_SIGNING_ENDPOINT"
            [ -n "$ACCOUNT" ] || missing="$missing AZURE_SIGNING_ACCOUNT"
            [ -n "$PROFILE" ] || missing="$missing AZURE_SIGNING_PROFILE"
            if [ -n "$missing" ]; then
              echo "::error::Tagged release is missing Windows signing secrets:$missing" >&2
              exit 1
            fi
          fi
          if [ -z "$ENDPOINT" ] || [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ]; then
            echo "Windows signing secrets are not set, so this build is unsigned."
            exit 0
          fi
          if [ -z "$CLI_VERSION" ]; then
            echo "::error::Set the repository variable ARTIFACT_SIGNING_CLI_VERSION to the NuGet version of the sign CLI to pin" >&2
            exit 1
          fi
          # Microsoft's `sign` CLI (the NuGet package `sign`): `sign code artifact-signing` is the documented way to sign
          # with Artifact Signing from a script, and it authenticates with DefaultAzureCredential from the job's
          # environment. It is installed to a fixed tool path rather than the global one, so the command below names an
          # executable that no PATH entry has to agree with; `dotnet` is already on the runner image. `--prerelease`
          # lets the pinned version be a preview release (the artifact-signing provider may only ship in one) and is a
          # no-op for a stable one.
          dotnet tool install --tool-path "$RUNNER_TEMP/sign-tools" sign --version "$CLI_VERSION" --prerelease
          sign_exe="$(cygpath -w "$RUNNER_TEMP/sign-tools/sign.exe")"
          printf 'CADABRA_SIGN_CMD=%s code artifact-signing -ase %s -asa %s -ascp %s\n' \
            "$sign_exe" "$ENDPOINT" "$ACCOUNT" "$PROFILE" >> "$GITHUB_ENV"
          echo "WIN_SIGN_CONFIG=--config src-tauri/tauri.windows.release.conf.json" >> "$GITHUB_ENV"
      # Tauri signs the app binary and the installer it builds; the files it copies in as resources and sidecars are signed
      # here, before the bundle, so Defender and SmartScreen see one signed payload (the macOS job signs its JRE the same way).
      - name: Sign the bundled Java runtime and sidecars (Windows)
        if: runner.os == 'Windows' && env.CADABRA_SIGN_CMD != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          read -r -a signer <<< "$CADABRA_SIGN_CMD"
          files=(
            apps/desktop/src-tauri/binaries/*.exe
            apps/desktop/src-tauri/binaries/jre/*/bin/*.exe
            apps/desktop/src-tauri/binaries/jre/*/bin/*.dll
            apps/desktop/src-tauri/binaries/jre/*/bin/server/*.dll
          )
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No bundled Windows binaries to sign" >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "signing $f"
            "${signer[@]}" "$(cygpath -w "$f")"
          done
      - name: Apple signing and notarization setup
        if: matrix.os == 'kinhin-xcode'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Exports to later steps through GITHUB_ENV only the variables that are set, and only the notarization
          # variables of the one mode in use. Tauri takes the Apple ID path when APPLE_ID, APPLE_PASSWORD and
          # APPLE_TEAM_ID are all present, even when empty, so an unset secret must never reach it. Secret values
          # are never printed; error messages name variables only.
          set -euo pipefail
          set_env() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          mode=none
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            mode=api
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            mode=apple-id
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -n "$missing" ]; then
              echo "::error::Tagged release is missing Apple signing secrets:$missing" >&2
              exit 1
            fi
            if [ "$mode" = none ]; then
              echo "::error::Tagged release needs notarization secrets: APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_PRIVATE_KEY, or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID" >&2
              exit 1
            fi
          fi
          if [ -n "$missing" ]; then
            echo "Apple signing secrets are incomplete (missing:$missing), so this build is not signed or notarized."
            mode=none
          fi
          if [ "$mode" != none ]; then
            set_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            set_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            set_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          fi
          if [ "$mode" = api ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            (umask 077 && printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path")
            set_env APPLE_API_ISSUER "$APPLE_API_ISSUER"
            set_env APPLE_API_KEY "$APPLE_API_KEY"
            set_env APPLE_API_KEY_PATH "$key_path"
          elif [ "$mode" = apple-id ]; then
            set_env APPLE_ID "$APPLE_ID"
            set_env APPLE_PASSWORD "$APPLE_PASSWORD"
            set_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
          fi
          set_env APPLE_NOTARY_MODE "$mode"
      - name: Sign the bundled Java runtime
        # tauri-action imports the certificate only when it builds, after the runtime exists, so the runtime is signed here
        # with the certificate in a temporary keychain that is removed before tauri-action runs (a second copy of the same
        # identity in the search list would make codesign ambiguous). APPLE_* come from the setup step through GITHUB_ENV.
        if: matrix.os == 'kinhin-xcode' && env.APPLE_NOTARY_MODE != 'none'
        run: bash scripts/with-signing-keychain.sh bash scripts/sign-jre.sh "$APPLE_SIGNING_IDENTITY"
      - name: Show Tauri bundler variables set on the runner
        if: matrix.os == 'kinhin-xcode'
        run: env | grep -i '^TAURI_BUNDLER' || echo "none set"
      - name: Let linuxdeploy find libjvm.so in the bundled Java runtime
        if: runner.os == 'Linux'
        # linuxdeploy runs ldd on every ELF file in the AppDir, including the jlink runtime, and libjava.so needs libjvm.so, which
        # sits in lib/server where ldd does not look ("ERROR: Could not find dependency: libjvm.so"). ldd honors LD_LIBRARY_PATH,
        # so list the runtime's server folder (the AppDir copy first, then the staged one) for the build.
        run: |
          cpu=$(uname -m); [ "$cpu" = arm64 ] && cpu=aarch64
          src="$PWD/apps/desktop/src-tauri"
          appdir="$src/target/release/bundle/appimage/CadabraCraft.AppDir/usr/lib/CadabraCraft/jre/$cpu/lib/server"
          echo "LD_LIBRARY_PATH=$appdir:$src/binaries/jre/$cpu/lib/server${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy and the AppImage plugin are AppImages themselves; a container has no FUSE, so run them extracted.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # The dmg script styles the window through Finder AppleScript, which times out on a runner with no GUI session; with CI set Tauri skips it.
          CI: "true"
          # Tauri ignores CI when this is "true"; the self-hosted macOS runner may export it, so pin it off here.
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json ${{ env.WIN_SIGN_CONFIG }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: CadabraCraft ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
      - name: Sign, notarize and staple the dmg
        # tauri-action notarizes the .app, and has already uploaded the unstapled .dmg to the release by now. The .dmg is submitted
        # here so that it is notarized and stapled; the next step replaces the release asset with this file.
        if: matrix.os == 'kinhin-xcode' && env.APPLE_NOTARY_MODE != 'none'
        run: |
          set -euo pipefail
          # The runner's bash is macOS's 3.2, which has neither globstar nor mapfile, so use find.
          dmgs=$(find apps/desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' -type f)
          count=$(printf '%s\n' "$dmgs" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one .dmg under target/**/bundle/dmg, found $count" >&2
            exit 1
          fi
          dmg="$dmgs"
          # tauri-action has removed its keychain by now, so codesign needs the certificate again.
          bash scripts/with-signing-keychain.sh codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          if [ "$APPLE_NOTARY_MODE" = api ]; then
            auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          xcrun notarytool submit "$dmg" "${auth[@]}" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "DMG_PATH=$PWD/$dmg" >> "$GITHUB_ENV"
      - name: Replace the release dmg with the stapled one
        # The release is a draft that tauri-action created and filled above, so overwriting the asset is not visible to anyone.
        # The digest check proves the asset on the release is byte for byte the stapled file.
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'kinhin-xcode' && env.APPLE_NOTARY_MODE != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo "::error::The GitHub CLI (gh) is not installed on this runner" >&2; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber
          name=$(basename "$DMG_PATH")
          remote=$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets[] | select(.name == \"$name\") | .digest")
          local_digest="sha256:$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"
          if [ "$remote" != "$local_digest" ]; then
            echo "::error::Release asset $name has digest '$remote', expected the stapled file's $local_digest" >&2
            exit 1
          fi
          echo "Release asset $name is the stapled dmg ($local_digest)"
      - name: Remove Apple API key file
        if: always() && matrix.os == 'kinhin-xcode' && env.APPLE_API_KEY_PATH != ''
        run: rm -f "$APPLE_API_KEY_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: cadabracraft-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/**/bundle/**
