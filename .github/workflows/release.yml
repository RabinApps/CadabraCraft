name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: kinhin-xcode
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: kinhin-container
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs --check "$GITHUB_REF_NAME"
      - name: Linux pnpm deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The standalone pnpm binary needs libatomic, which the container image lacks.
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libfuse2 zlib1g-dev && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Bundled Typst and fonts
        run: bash scripts/fetch-typst.sh ${{ runner.os == 'kinhin-xcode' && '--all' || '' }}
      - name: Bundled voice engine (sherpa-onnx)
        run: bash scripts/fetch-sherpa.sh ${{ runner.os == 'kinhin-xcode' && '--all' || '' }}
      - name: MSYS2 toolchain for ffmpeg
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Bundled audio encoder (ffmpeg)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-ffmpeg.sh ${{ runner.os == 'kinhin-xcode' && '--all' || '' }}
      - name: Bundled audio encoder (ffmpeg, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/fetch-ffmpeg.sh
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: CadabraCraft ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: cadabracraft-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/**/bundle/**
