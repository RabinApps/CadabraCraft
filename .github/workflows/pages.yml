name: website
on:
  push:
    branches: [main]
    paths: ["apps/website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: kinhin-container
    steps:
      - uses: actions/checkout@v7
      - name: Linux pnpm deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The standalone pnpm binary needs libatomic, which the container image lacks.
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cadabracraft/website build
      - uses: actions/upload-pages-artifact@v5
        with: { path: apps/website/out }
  deploy:
    needs: build
    runs-on: kinhin-container
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
