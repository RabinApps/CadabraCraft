name: ci
on: [push, pull_request]
jobs:
  js:
    strategy:
      matrix:
        os: [kinhin-container, kinhin-xcode, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_EPUBCHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-epubcheck.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: pnpm test:e2e
        working-directory: apps/desktop
        env: { CI: "1" }
  rust:
    strategy:
      matrix:
        os: [kinhin-container, kinhin-xcode, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # Parallel jobs can share one machine: wait for the dpkg lock and retry if another apt clobbers our downloads.
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p apps/desktop/dist
      - run: cargo test
        working-directory: apps/desktop/src-tauri
