name: ci
on: [push, pull_request, workflow_call]
jobs:
  js:
    strategy:
      matrix:
        os: [kinhin-container, kinhin-xcode, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_EPUBCHECK: "1"
      REQUIRE_ENWIK8: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Linux pnpm deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The standalone pnpm binary needs libatomic, which the container image lacks.
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-epubcheck.sh
      - run: bash scripts/fetch-enwik8.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: pnpm test:e2e
        working-directory: apps/desktop
        env: { CI: "1" }
  rust:
    strategy:
      matrix:
        os: [kinhin-container, kinhin-xcode, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # Parallel jobs can share one machine: wait for the dpkg lock and retry if another apt clobbers our downloads.
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p apps/desktop/dist
      - run: bash scripts/fetch-typst.sh
      - run: bash scripts/fetch-sherpa.sh
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      # End to end on every OS: download the Piper voices (148 MB) over TLS, check their hashes, and speak a sentence into
      # Opus and FLAC with the bundled engine. It is the only place the Windows and Linux engine builds are run.
      - name: Voice download and bundled engine
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""; [[ $triple == *windows* ]] && exe=".exe"
          export SHERPA_TTS_BIN="$PWD/binaries/sherpa-onnx-offline-tts-$triple$exe"
          [[ $triple == *windows* ]] && SHERPA_TTS_BIN=$(cygpath -w "$SHERPA_TTS_BIN")
          export CADABRA_NET_TESTS=full CADABRA_NET_PACKS=piper
          cargo test --lib real_packs -- --nocapture
        working-directory: apps/desktop/src-tauri
