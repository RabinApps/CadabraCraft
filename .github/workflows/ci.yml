name: ci
on:
  push:
    branches: [main, develop] # a PR branch is tested by its pull_request run; a push run as well would double the load and collide on e2e port 1420
  pull_request:
  workflow_call:
    inputs:
      skip-e2e:
        description: Skip the browser and WebDriver jobs (e2e, coverage, a11y, webdriver) and the Rust coverage steps; release.yml sets it
        type: boolean
        default: false
permissions:
  contents: read
# A new push to a PR cancels that PR's older run. Runs on main and runs called from release.yml are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Which jobs run: a pull request runs only what its change can reach (`changes`, scripts/affected/affected.mjs, docs/testing.md
# "Test selection"). A push to main, a release run (workflow_call) and a PR with the `full-ci` label run everything, and the
# coverage floors are checked only then. Shared steps live in .github/actions (ports, apt, setup-js, js-tools, cargo-cache).
# Runners (cost: docs/architecture.md, "Heavy CI jobs back on the self-hosted runners"): the quick jobs run on Blacksmith (one
# machine per job; its colocated cache serves actions/cache and the pnpm cache of actions/setup-node at no extra cost): `changes`,
# `static`, `website`, `unit` (Linux), `licenses` and `ci-ok`, sized 2 vCPU for the script jobs and 4 for the rest. The long jobs
# run on the self-hosted machines: the four `e2e` shards, `coverage`, `a11y`, `webdriver` and the Linux `rust` leg on
# kinhin-container, the macOS `unit` and `rust` legs on kinhin-xcode (a pull request's macOS `rust` leg uses a Blacksmith Mac). Only release.yml also signs on kinhin-xcode, which holds
# the Developer ID certificate and the notary key. Windows (the `unit` and `rust` legs, and `webdriver-windows`) runs on
# GitHub's windows-latest, where the WebView2 runtime and msedgedriver are.
# A release run (release.yml) passes `skip-e2e`: it runs static, unit, rust, licenses and website, but not e2e, coverage, a11y or webdriver.
env:
  FULL_RUN: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
jobs:
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      full: ${{ steps.select.outputs.full }}
      rust: ${{ steps.select.outputs.rust }}
      e2e: ${{ steps.select.outputs.e2e }}
      e2e_specs: ${{ steps.select.outputs.e2e_specs }}
      e2e_shards: ${{ steps.select.outputs.e2e_shards }}
      a11y: ${{ steps.select.outputs.a11y }}
      a11y_tools: ${{ steps.select.outputs.a11y_tools }}
      a11y_pages: ${{ steps.select.outputs.a11y_pages }}
      tools: ${{ steps.select.outputs.tools }}
      webdriver: ${{ steps.select.outputs.webdriver }}
      licenses: ${{ steps.select.outputs.licenses }}
      website: ${{ steps.select.outputs.website }}
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: "${{ github.event_name == 'pull_request' && '0' || '1' }}" }
      - uses: ./.github/actions/apt
        with: { packages: libatomic1 } # Node needs it; a no-op on an image that already has it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - id: select
        run: node scripts/affected/affected.mjs
        env:
          AFFECTED_BASE: origin/${{ github.base_ref }}
          FORCE_FULL: ${{ env.FULL_RUN == 'true' && '1' || '0' }}
  # Fast checks that need no browser or external tool. Always runs. On a pull request that is not a full run, typecheck covers the
  # changed packages and their dependents, and eslint and prettier the changed files (scripts/affected/static-checks.sh); size and
  # the scripts' tests always see the whole tree.
  static:
    needs: changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: "${{ github.event_name == 'pull_request' && '0' || '1' }}" }
      - uses: ./.github/actions/setup-js
      - name: Typecheck, lint and format
        run: bash scripts/affected/static-checks.sh
        env:
          AFFECTED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          FULL: ${{ needs.changes.outputs.full }}
      - run: pnpm check:size
      - run: pnpm test:scripts
  # `next build` of the website (typecheck and static export), so a broken page fails the pull request instead of the deploy
  # after the merge (pages.yml). Runs only when the website changed.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - run: pnpm --filter @cadabracraft/website build
  # Vitest in the packages the change reaches (all of them on a full run), with the external tools the exporters' tests drive.
  unit:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.packages != ''
    strategy:
      fail-fast: false # one OS failing must not hide how the others do
      matrix:
        # Windows ships with the first release, so its leg runs on every PR (that is where the Windows-only branches in the
        # packages and the sidecar scripts are exercised). macOS runs on full runs only: the pull request run is Linux and
        # Windows.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["blacksmith-4vcpu-ubuntu-2404","windows-latest"]' || '["blacksmith-4vcpu-ubuntu-2404","kinhin-xcode","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # The tools and the variables that make their tests required come only when the change reaches a package that drives one
      # (the `tools` output of scripts/affected/affected.mjs); a full run always has them.
      REQUIRE_EPUBCHECK: ${{ needs.changes.outputs.tools == 'true' && '1' || '' }}
      REQUIRE_ENWIK8: ${{ needs.changes.outputs.tools == 'true' && '1' || '' }}
      # Puppeteer (Ace) keeps its Chrome per job: the Linux runners share /root, and two jobs unpacking into the same
      # ~/.cache/puppeteer at once failed with ENOENT. /tools is gitignored.
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/setup-js
        with: { java: "${{ needs.changes.outputs.tools }}" }
      - if: needs.changes.outputs.tools == 'true'
        uses: ./.github/actions/js-tools
      - name: Unit tests
        shell: bash
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$FULL" = "true" ]; then pnpm test; exit; fi
          args=(); for p in ${PACKAGES//,/ }; do args+=(--filter "$p"); done
          pnpm "${args[@]}" test
  # The Playwright e2e suite (Chromium against the dev server, fake Tauri backend), in shards. No coverage here: it is
  # about three times slower per test, and its floors are checked by the `coverage` job on full runs.
  # A change runs only the specs it can reach: spec files themselves, the specs that import a changed e2e helper, and the specs
  # that called into a changed app source or package file (e2e/spec-map.json). A file nothing knows, and a full run, keep all four shards. See the selection rules
  # in scripts/affected/affected.mjs and docs/testing.md, "Test selection".
  # A shard that dies at once with "Lazy deopt after a fast API call with return value is unsupported" is the V8 bug in
  # nodejs/node#66870, not the app: see "Known flaky failures in CI" in docs/testing.md and rerun the failed jobs.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && !inputs.skip-e2e
    runs-on: kinhin-container
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A named list of specs gets one job per 20 specs (at most four); the whole suite gets four.
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/setup-js
      - name: Playwright Chromium and its system libraries
        working-directory: apps/desktop
        run: |
          LOCK=""; command -v flock >/dev/null 2>&1 && LOCK="flock /tmp/ci-apt.lock"
          for i in 1 2 3 4 5; do
            $LOCK pnpm exec playwright install --with-deps chromium && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Playwright
        working-directory: apps/desktop
        run: |
          # A spec list from the selection runs only those specs, in one job or (over 20 specs) in up to four shards of the list;
          # otherwise this is one of four shards of the whole suite.
          if [ -n "$E2E_SPECS" ]; then
            IFS=',' read -r -a specs <<< "$E2E_SPECS"
            pnpm exec playwright test "${specs[@]}" --shard="$SHARD/$SHARDS" --trace off
          else
            pnpm exec playwright test --shard="$SHARD/$SHARDS" --trace off
          fi
        # Three workers per shard, as the coverage run used: the default (half the cores) times four shards oversubscribes a shared machine.
        env:
          CI: "1"
          E2E_WORKERS: "3"
          E2E_SPECS: ${{ needs.changes.outputs.e2e_specs }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
  # Full runs only: unit and e2e coverage with the floors of scripts/coverage.mjs (docs/testing.md, "Coverage").
  coverage:
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && !inputs.skip-e2e
    runs-on: kinhin-container
    timeout-minutes: 120
    env:
      REQUIRE_EPUBCHECK: "1"
      REQUIRE_ENWIK8: "1"
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/setup-js
        with: { java: "true" }
      - uses: ./.github/actions/js-tools
      - run: pnpm test:coverage:unit
      # The Playwright run merges the V8 data of ~3000 tests in one process at the end (globalTeardown), which needed
      # more than Node's default 2 GB heap (run #164 died in it); give it 60% of the machine's memory, at most 8 GB.
      - name: Playwright coverage run
        run: |
          mem_mb=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          heap_mb=$((mem_mb * 6 / 10)); [ "$heap_mb" -gt 8192 ] && heap_mb=8192
          echo "cores: $(nproc), memory: ${mem_mb} MB, Node heap for the e2e coverage run: ${heap_mb} MB"
          NODE_OPTIONS="--max-old-space-size=${heap_mb}" SPEC_MAP=1 pnpm --filter @cadabracraft/desktop test:e2e:coverage
      # The run also rewrote e2e/spec-map.json (which specs call into which sources, see "Test selection" in docs/testing.md).
      # Say in the summary whether the committed map is out of date; refresh it with `pnpm --filter @cadabracraft/desktop e2e:map`.
      - name: Is the committed spec map current?
        run: |
          # No parts folder, or a marker from a merge that refused (specs missing): the run says nothing about the map.
          if [ ! -d coverage/spec-map-parts ] || [ -e coverage/spec-map-incomplete ]; then
            echo "::warning::the spec map could not be checked: this run did not record every spec (see the coverage run's log)."
          elif node -e '
            // The run writes compact JSON and the committed file is formatted: compare what they say, not their bytes.
            const { execSync } = require("node:child_process");
            const committed = JSON.parse(execSync("git show HEAD:apps/desktop/e2e/spec-map.json"));
            const fresh = JSON.parse(require("node:fs").readFileSync("apps/desktop/e2e/spec-map.json", "utf8"));
            process.exit(JSON.stringify(committed) === JSON.stringify(fresh) ? 0 : 1);
          '; then
            echo "The spec map is current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::apps/desktop/e2e/spec-map.json is out of date (download it from the javascript-coverage artifact and commit it)."
          fi
      - run: pnpm coverage:report:js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript-coverage
          path: |
            coverage/merged/lcov.info
            coverage/merged/summary.json
            coverage/e2e/coverage-summary.json
            apps/desktop/coverage/coverage-summary.json
            apps/desktop/e2e/spec-map.json
          if-no-files-found: error
  # Every automated accessibility gate in one place (scripts/a11y.sh) with the validators: veraPDF (PDF/UA-1, PDF/A-2b) on
  # real Typst output, Ace on the sample EPUBs, LibreOffice for docx and rtf. The stage table goes to the job summary. The
  # Chromium Playwright a11y specs are not run here: the sharded `e2e` job runs every spec in e2e/ (including all of them),
  # so a second run would only repeat it (scripts/a11y.sh --no-chromium; a local `pnpm a11y` still runs them).
  # NOT RUN YET: these steps have never run in CI (written on an unpushed branch); the first run may need fixes. The
  # a11y.sh step is required; the WebKit run (the engine of WKWebView and WebKitGTK) is continue-on-error until it has run
  # green a few times (docs/testing.md). This job replaces the old webkit-a11y job.
  a11y:
    needs: changes
    if: needs.changes.outputs.a11y == 'true' && !inputs.skip-e2e
    runs-on: kinhin-container
    timeout-minutes: 120 # sized when this job also ran the Chromium suite (about 50 min with WebKit alone, twice that beside other jobs; run #173 hit 60): lower it once a run shows how long the stages take now
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/puppeteer # see the js job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      # The exporter validators (veraPDF, Ace, LibreOffice) run when a change reaches an exporter (or on a full run); the page
      # sweeps (WebKit) when it reaches the app's pages. Each part installs only what it needs (`a11y_tools`, `a11y_pages`).
      - if: needs.changes.outputs.a11y_tools == 'true'
        uses: ./.github/actions/apt
        with: { packages: libreoffice-writer, flags: --no-install-recommends }
      - uses: ./.github/actions/setup-js
        with: { java: "${{ needs.changes.outputs.a11y_tools }}" }
      # Chromium and WebKit with their system libraries; the Chromium libraries also serve Puppeteer's Chrome for Ace.
      - name: Playwright browsers and their system libraries
        shell: bash
        working-directory: apps/desktop
        run: |
          # Jobs on one runner machine share /tmp and the dpkg state, and two concurrent `apt-get install` runs made dpkg lose
          # its .deb files ("cannot access archive /tmp/apt-dpkg-install-*"). Take a machine-wide lock where flock exists (not macOS).
          LOCK=""; command -v flock >/dev/null 2>&1 && LOCK="flock /tmp/ci-apt.lock"
          for i in 1 2 3 4 5; do
            $LOCK pnpm exec playwright install --with-deps chromium ${PAGES:+webkit} && exit 0
            sleep $((i * 5))
          done
          exit 1
        env: { PAGES: "${{ needs.changes.outputs.a11y_pages == 'true' && '1' || '' }}" }
      - if: needs.changes.outputs.a11y_tools == 'true'
        run: bash scripts/fetch-ace.sh
      - name: veraPDF and Typst
        if: needs.changes.outputs.a11y_tools == 'true'
        run: |
          bash scripts/fetch-verapdf.sh
          bash scripts/fetch-typst.sh
          bin=$(ls "$PWD"/apps/desktop/src-tauri/binaries/typst-* | head -n 1)
          {
            echo "VERAPDF_BIN=$PWD/tools/verapdf/verapdf"
            echo "TYPST_BIN=$bin"
            echo "TYPST_FONT_PATHS=$PWD/apps/desktop/src-tauri/binaries/fonts"
          } >> "$GITHUB_ENV"
      # a11y.sh itself sets REQUIRE_VERAPDF=1 and REQUIRE_ACE=1 (and REQUIRE_SOFFICE=1 for LibreOffice) on the tools it finds.
      # It prints the stage table at the end, also when a stage fails, so tee it into the job summary.
      - name: Accessibility stages (scripts/a11y.sh)
        shell: bash # explicit shell: GitHub adds `set -eo pipefail`, so tee does not hide the script's exit code
        env: { TOOLS: "${{ needs.changes.outputs.a11y_tools }}" }
        run: |
          status=0
          # --tools adds the validators; without them the exporter output tests are skipped too (--no-exporters).
          flags="--tools --no-chromium"; [ "$TOOLS" = "true" ] || flags="--no-exporters --no-chromium"
          bash scripts/a11y.sh $flags 2>&1 | tee a11y-stages.log || status=$?
          {
            echo '### Accessibility stages'
            echo '```'
            sed -n '/^Accessibility stages/,$p' a11y-stages.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: WebKit accessibility specs
        if: needs.changes.outputs.a11y_pages == 'true'
        continue-on-error: true
        run: pnpm test:e2e:webkit
        working-directory: apps/desktop
        env: { CI: "1" }
  # Dependency licenses: the allowlist for npm and Rust, advisories (npm and Rust), and the generated notices must be current.
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt
        with: { packages: build-essential }
      - uses: ./.github/actions/setup-js
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs. A Blacksmith
      # runner has its machine to itself (its name has no -rN suffix), so it keeps the default folders, which are the ones the
      # cargo cache restores.
      - run: |
          slot="${RUNNER_NAME##*-r}"; case "$slot" in ''|*[!0-9]*) slot="" ;; esac
          echo "RUSTUP_HOME=$HOME/.rustup$slot" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo$slot" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - uses: ./.github/actions/cargo-cache # the two installed tools dominate this job
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo install --locked cargo-about@0.9.3 --features cli
      - run: pnpm licenses:check
      # Known advisories in the JavaScript the app ships (`--prod`: the tree npm-licenses.mjs checks; `cargo deny check
      # advisories` above covers Rust). Moderate and above fail the job; low is printed and does not, because an
      # unfixable low is not worth an override or an ignore and gating on it would only be worked around. Moderate now
      # fails because `high` had stayed silent on six moderates pnpm was reporting, and pinning them showed they were
      # fixable; the shipped tree is clean at moderate and above. Run it by hand with `pnpm licenses:npm-advisories`.
      - run: pnpm licenses:npm-advisories
      # The perf probe and the fuzz crate have their own lockfiles that `cargo deny check` above does not see.
      - run: pnpm licenses:tools-advisories
  # The real built app driven through tauri-driver (WebKitWebDriver) under a virtual display. Linux only: tauri-driver does
  # not exist for macOS, and the Windows job needs msedgedriver set up. Not a required check yet (continue-on-error): this
  # suite has not run against a real driver, so the first runs may need selector or timing fixes; it fails visibly (red
  # job) but does not block merges. Make it required once it has been green a few times (docs/testing.md).
  webdriver:
    needs: changes
    if: needs.changes.outputs.webdriver == 'true' && !inputs.skip-e2e
    runs-on: kinhin-container
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/apt
        with:
          {
            packages: build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zlib1g-dev webkit2gtk-driver xvfb xz-utils,
          }
      - uses: ./.github/actions/setup-js
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs. A Blacksmith
      # runner has its machine to itself (its name has no -rN suffix), so it keeps the default folders, which are the ones the
      # cargo cache restores.
      - run: |
          slot="${RUNNER_NAME##*-r}"; case "$slot" in ''|*[!0-9]*) slot="" ;; esac
          echo "RUSTUP_HOME=$HOME/.rustup$slot" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo$slot" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - uses: ./.github/actions/cargo-cache
      - run: bash scripts/fetch-typst.sh
      - run: bash scripts/fetch-sherpa.sh
      - run: bash scripts/fetch-ffmpeg.sh
      # Pinned like the other cargo tools; --locked uses the crate's own lockfile.
      # The runner image has tauri-driver 2.1.0 on PATH; install it into this job's cargo home only on a machine without it.
      - run: command -v tauri-driver || cargo install --locked tauri-driver@2.1.0
      - name: Check the WebDriver tools
        run: |
          PATH="$CARGO_HOME/bin:$PATH"
          command -v tauri-driver # tauri-driver has no --version flag: it prints its help and exits 1
          command -v xvfb-run
          command -v WebKitWebDriver
      - name: Build the app (debug, dev-automation bridge for the dialog answers)
        run: pnpm --filter @cadabracraft/desktop build:native
      - name: WebDriver e2e
        timeout-minutes: 15 # the suite takes under a minute; a hang after the tests (run #168) must fail fast, not wait for the job's timeout
        run: xvfb-run --auto-servernum pnpm test:e2e:webdriver
        env: { CI: "1" }
  # The same native suite on Windows, where tauri-driver reaches WebView2 through msedgedriver instead of WebKitWebDriver.
  # Not a required check (continue-on-error), and on a GitHub-hosted runner it cannot pass as things stand: WebView2 Runtime
  # 150 and later ignore `--remote-debugging-port` (which msedgedriver passes through WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS) in
  # an elevated process, and these runners run as administrator, so the CDP port never opens and every session dies with
  # "DevToolsActivePort file doesn't exist" (tauri-apps/wry#1782; wry declined a change, and wry's own
  # set_additional_browser_arguments wins over the variable anyway, tauri-apps/wry#1805). Verified against the 2026-11-22 run:
  # the runtime and msedgedriver versions matched exactly. Unblocking it needs the app started de-elevated (gsudo) or a pinned
  # WebView2 149 runtime (docs/testing.md, "WebDriver e2e"). Until then the job reports the failure and `ci-ok` ignores it.
  # A release run skips it (`skip-e2e`).
  webdriver-windows:
    needs: changes
    if: needs.changes.outputs.webdriver == 'true' && !inputs.skip-e2e
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/setup-js
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      # `tauri build --no-bundle` still checks that every externalBin exists for the host triple.
      - run: bash scripts/fetch-typst.sh
      - run: bash scripts/fetch-sherpa.sh
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          path-type: inherit
          install: make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Bundled audio encoder (ffmpeg)
        shell: msys2 {0}
        run: bash scripts/fetch-ffmpeg.sh
      - name: tauri-driver
        shell: bash
        run: command -v tauri-driver || cargo install --locked tauri-driver@2.1.0
      # tauri-driver starts msedgedriver itself; it must match the WebView2 runtime on the runner. The full build number is
      # the usual driver version, then the newest driver for that major (LATEST_RELEASE_<major>) and LATEST_STABLE when
      # Microsoft has not published that exact one yet. The Application folder also holds non-version folders (for example
      # PlatformExperiencesHelper), and casting one of those to [version] aborts the step, so only version names are sorted.
      - name: msedgedriver matching the installed WebView2
        shell: pwsh
        run: |
          $root = Join-Path ${env:ProgramFiles(x86)} "Microsoft\EdgeWebView\Application"
          $version = Get-ChildItem $root -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $version) { throw "No WebView2 runtime version found under $root" }
          $major = ($version -split '\.')[0]
          $zip = Join-Path $env:RUNNER_TEMP "edgedriver.zip"
          $candidates = @($version)
          try {
            $latest = (Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/LATEST_RELEASE_$major").Content.Trim()
            if ($latest) { $candidates += $latest }
          } catch { Write-Host "no LATEST_RELEASE_$major listing" }
          $candidates += "LATEST_STABLE"
          $found = $false
          foreach ($candidate in $candidates) {
            try {
              Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$candidate/edgedriver_win64.zip" -OutFile $zip
              Write-Host "msedgedriver $candidate"
              $found = $true
              break
            } catch { Write-Host "no msedgedriver for $candidate" }
          }
          if (-not $found) { throw "Could not download msedgedriver for WebView2 $version" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "msedgedriver") -Force
          (Join-Path $env:RUNNER_TEMP "msedgedriver") | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build the app (debug, dev-automation bridge for the dialog answers)
        run: pnpm --filter @cadabracraft/desktop build:native
      - name: WebDriver e2e
        timeout-minutes: 15
        shell: bash
        run: pnpm test:e2e:webdriver
        env: { CI: "1" }
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false # one OS failing must not hide how the others do
      matrix:
        # Windows is back now that it ships with the first release: the Windows-only Rust code paths, the MSYS2 ffmpeg build
        # and the `.exe` sidecars only ever run there.
        # kinhin-xcode also signs and notarizes releases (the Developer ID certificate and the notary key live there), so a pull request's
        # code never runs on it: the PR run uses a Blacksmith Mac, and the push to main and the release run use kinhin-xcode.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["kinhin-container","blacksmith-6vcpu-macos-latest","windows-latest"]' || '["kinhin-container","kinhin-xcode","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ffmpeg (with ffprobe) is for the encoder tests that decode their output (audio/encode.rs); they skip without it, and then drop out of the coverage numbers.
      - uses: ./.github/actions/apt
        with:
          {
            packages: build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zlib1g-dev ffmpeg xz-utils,
          }
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs. A Blacksmith
      # runner has its machine to itself (its name has no -rN suffix), so it keeps the default folders, which are the ones the
      # cargo cache restores.
      - run: |
          slot="${RUNNER_NAME##*-r}"; case "$slot" in ''|*[!0-9]*) slot="" ;; esac
          echo "RUSTUP_HOME=$HOME/.rustup$slot" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo$slot" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - uses: ./.github/actions/cargo-cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with: { node-version: 26 }
      - run: mkdir -p apps/desktop/dist
      - run: bash scripts/fetch-typst.sh
      - run: bash scripts/fetch-sherpa.sh
      # The M4B encoder is built from the pinned ffmpeg source (LGPL-only, minimal). Windows builds with MSYS2's MinGW gcc.
      - name: MSYS2 toolchain for ffmpeg
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          path-type: inherit
          install: make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Bundled audio encoder (ffmpeg)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-ffmpeg.sh
      - name: Bundled audio encoder (ffmpeg, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/fetch-ffmpeg.sh
      # Style is in apps/desktop/src-tauri/rustfmt.toml; run `cargo fmt` to fix.
      - name: Rust formatting (rustfmt)
        shell: bash
        run: |
          rustup component add rustfmt
          cargo fmt --check
        working-directory: apps/desktop/src-tauri
      # Lints are in Cargo.toml ([lints]): no unsafe beyond the one documented kill, no unwrap/expect/panic in production code.
      - name: Rust lints (clippy)
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      # --lib: all unit tests live in the lib; on Windows the script embeds the test manifest (see the script).
      # TYPST_BIN: the real-Typst tests look for the sidecar next to the program, and the test executable sits in
      # target/debug/deps, not in target/debug with the sidecars tauri-build copies there. REQUIRE_TYPST makes a typst that
      # cannot be found or run fail the step instead of skipping those tests.
      - name: Rust tests
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""; [[ $triple == *windows* ]] && exe=".exe"
          export TYPST_BIN="$PWD/binaries/typst-$triple$exe"
          [[ $triple == *windows* ]] && TYPST_BIN=$(cygpath -w "$TYPST_BIN")
          export REQUIRE_TYPST=1
          bash ../../../scripts/cargo-test.sh
        working-directory: apps/desktop/src-tauri
      # Windows has no full ffmpeg. The two decode tests in audio/encode.rs therefore stop at their capability check, and a
      # passing test hides its stderr, so the skip never shows in the log above. This runs just those tests with their output
      # visible and fails unless the capability check is what stopped them: that is the evidence for what docs/testing.md,
      # "External-tool tests", says about the Windows decode gap (the bare `ffmpeg` is the app's own minimal M4B build, which
      # tauri-build copies into target/ without the CPU suffix and the test program finds through its search path). If the
      # image ever ships a full ffmpeg, the tests decode instead and this step needs replacing with a real assertion.
      - name: "FFmpeg decode tests (Windows: the capability skip)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          log=target/ffmpeg-decode.log
          bash ../../../scripts/cargo-test.sh ffmpeg_decodes -- --nocapture > "$log" 2>&1 || { cat "$log"; exit 1; }
          grep -E '^(test |skipping)' "$log" || true
          grep -q 'skipping: the ffmpeg found cannot write raw PCM or read these containers back' "$log" || {
            echo "::error::the decode tests did not stop at their capability check; see above"
            exit 1
          }
        working-directory: apps/desktop/src-tauri
      - name: Rust coverage (Linux)
        if: runner.os == 'Linux' && !inputs.skip-e2e
        # The tests that decode audio with ffmpeg skip when it is missing, and a skipped test takes its lines out of the
        # numbers; with this set a missing ffmpeg fails the step instead. The table goes to the job summary.
        env: { REQUIRE_FFMPEG: "1" }
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --lib --lcov --ignore-filename-regex 'src/main.rs' > target/llvm-cov.lcov
          cargo llvm-cov report --json --ignore-filename-regex 'src/main.rs' > target/llvm-cov-summary.json
          cd ../../..
          node scripts/coverage.mjs --rust-only
        working-directory: apps/desktop/src-tauri
      - name: Upload Rust coverage (Linux)
        if: runner.os == 'Linux' && !inputs.skip-e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: coverage/merged/rust-lcov.info
          if-no-files-found: error
      # The bundled encoder builds a real M4B (AAC, chapters, cover) on every OS, so the Windows and Linux builds are run.
      - name: Bundled encoder (M4B)
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""; [[ $triple == *windows* ]] && exe=".exe"
          export FFMPEG_BIN="$PWD/binaries/ffmpeg-$triple$exe"
          [[ $triple == *windows* ]] && FFMPEG_BIN=$(cygpath -w "$FFMPEG_BIN")
          export REQUIRE_FFMPEG=1
          bash ../../../scripts/cargo-test.sh real_ffmpeg -- --nocapture
        working-directory: apps/desktop/src-tauri
      # End to end on every OS: download the Piper voices (148 MB) over TLS, check their hashes, and speak a sentence into
      # Opus and FLAC with the bundled engine. It is the only place the Windows and Linux engine builds are run.
      # REQUIRE_SHERPA: without it the test skips the render when the engine is missing and still passes, which would hide
      # a sidecar that does not run.
      - name: Voice download and bundled engine
        shell: bash
        env: { REQUIRE_SHERPA: "1" }
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""; [[ $triple == *windows* ]] && exe=".exe"
          export SHERPA_TTS_BIN="$PWD/binaries/sherpa-onnx-offline-tts-$triple$exe"
          [[ $triple == *windows* ]] && SHERPA_TTS_BIN=$(cygpath -w "$SHERPA_TTS_BIN")
          export CADABRA_NET_TESTS=full CADABRA_NET_PACKS=piper
          bash ../../../scripts/cargo-test.sh real_packs -- --nocapture
        working-directory: apps/desktop/src-tauri
  # The one check branch protection requires: green when every job that ran passed (a skipped job is a job the change cannot reach).
  ci-ok:
    if: ${{ !cancelled() }} # not always(): a cancelled run (a newer push) must end at once, or its ci-ok holds the concurrency group and the new run waits
    needs:
      [
        changes,
        static,
        unit,
        website,
        e2e,
        coverage,
        a11y,
        licenses,
        webdriver,
        webdriver-windows,
        rust,
      ]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Every needed job passed or was skipped
        env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
