name: ci
on:
  push:
    branches: [main] # a PR branch is tested by its pull_request run; a push run as well would double the load and collide on e2e port 1420
  pull_request:
  workflow_call:
permissions:
  contents: read
# A new push to a PR cancels that PR's older run. Runs on main and runs called from release.yml are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Shadow mode: says in the job summary which parts of CI the change could affect (scripts/affected/affected.mjs), but
  # nothing below depends on it yet, so every job still runs in full. The selection is enforced only after it has missed
  # no failing test over a couple of weeks of pull requests (docs/architecture.md, "Selecting tests"). The `full-ci`
  # label already forces the answer to "everything".
  changes:
    if: github.event_name == 'pull_request'
    runs-on: kinhin-container
    continue-on-error: true # a shadow check never fails the run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Linux libatomic (Node needs it)
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The container image lacks libatomic1, without which the Node arm64 build exits with 127 (see "Linux pnpm deps" below).
          if dpkg -s libatomic1 >/dev/null 2>&1; then echo "libatomic1 already installed"; exit 0; fi
          # One apt at a time on a machine (see the other apt steps).
          command -v flock >/dev/null 2>&1 && { exec 9>/tmp/ci-apt.lock; flock 9; }
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - run: node scripts/affected/affected.mjs
        env:
          AFFECTED_BASE: origin/${{ github.base_ref }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && '1' || '0' }}
  js:
    strategy:
      fail-fast: false # one OS failing must not hide how the others do
      matrix:
        # Windows is off for now: the first release is macOS and Linux (see release.yml), and the Windows runner is the
        # slowest of the three. Put `windows-latest` back in this list to test it again; the steps below that only run
        # there are still in place.
        os: [kinhin-container, kinhin-xcode]
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_EPUBCHECK: "1"
      REQUIRE_ENWIK8: "1"
      # Puppeteer (Ace) keeps its Chrome per job: the Linux runners share /root, and two jobs unpacking into the same
      # ~/.cache/puppeteer at once failed with ENOENT. /tools is gitignored.
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ports for this runner
        shell: bash
        run: |
          # The runners of one machine (names ending -r1 to -r4) share its network, so two jobs that start a server on a fixed
          # port collide ("http://localhost:1420 is already used"). One job runs per runner at a time: the runner's number
          # gives it ports of its own. Where the name has no such number (a hosted runner), the defaults stay.
          slot="${RUNNER_NAME##*-r}"; case "$slot" in ''|*[!0-9]*) slot=0 ;; esac
          echo "E2E_PORT=$((1420 + slot))" >> "$GITHUB_ENV"
          echo "TAURI_DRIVER_PORT=$((4444 + slot * 2))" >> "$GITHUB_ENV"
      - name: Linux pnpm deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The runner image already has these; skip apt then, so jobs on one machine do not race on its caches.
          if dpkg -s libatomic1 binutils unzip xz-utils >/dev/null 2>&1; then echo "system packages already installed"; exit 0; fi
          # The standalone pnpm binary needs libatomic, which the container image lacks; jlink (--strip-debug) runs objcopy, from binutils; unzip unpacks the veraPDF installer.
          # Jobs on one machine share dpkg and /var/cache/apt: one apt at a time (the lock is held until this step ends), or a second apt deletes the first one's downloads.
          command -v flock >/dev/null 2>&1 && { exec 9>/tmp/ci-apt.lock; flock 9; }
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 binutils unzip xz-utils && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Linux LibreOffice (docx and rtf smoke tests)
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The runner image already has these; skip apt then, so jobs on one machine do not race on its caches.
          if dpkg -s libreoffice-writer >/dev/null 2>&1; then echo "system packages already installed"; echo "REQUIRE_SOFFICE=1" >> "$GITHUB_ENV"; exit 0; fi
          # Jobs on one machine share dpkg and /var/cache/apt: one apt at a time (the lock is held until this step ends), or a second apt deletes the first one's downloads.
          command -v flock >/dev/null 2>&1 && { exec 9>/tmp/ci-apt.lock; flock 9; }
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends libreoffice-writer && echo "REQUIRE_SOFFICE=1" >> "$GITHUB_ENV" && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { dest: "~/setup-pnpm-${{ runner.name }}" } # one folder per runner: jobs sharing ~/setup-pnpm overwrite each other
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: pnpm }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-epubcheck.sh
      # The EPUB checker and trimmed Java runtime that ship in the app: stage them, build the runtime with jlink and run EPUBCheck with it on the sample EPUB.
      - name: Bundled EPUB checker and Java runtime
        if: runner.os != 'Windows'
        run: |
          pnpm --filter @cadabracraft/export-epub build:sample
          bash scripts/stage-epubcheck.sh
          bash scripts/build-jre.sh
      # Chromium plus its system libraries (libnss3, libatk-bridge2.0-0, libgbm1 ...). This runs before `pnpm test` on purpose:
      # the Ace test inside `pnpm test` starts Puppeteer's own Chrome, which needs the same libraries on Linux.
      - name: Playwright Chromium and its system libraries
        shell: bash
        working-directory: apps/desktop
        run: |
          # Jobs on one runner machine share /tmp and the dpkg state, and two concurrent `apt-get install` runs made dpkg lose
          # its .deb files ("cannot access archive /tmp/apt-dpkg-install-*"). Take a machine-wide lock where flock exists (not macOS).
          LOCK=""; command -v flock >/dev/null 2>&1 && LOCK="flock /tmp/ci-apt.lock"
          for i in 1 2 3 4 5; do
            $LOCK pnpm exec playwright install --with-deps chromium && exit 0
            sleep $((i * 5))
          done
          exit 1
      # Ace by DAISY (EPUB accessibility): npm installs it into tools/ace and Puppeteer downloads its own Chrome.
      - run: bash scripts/fetch-ace.sh
      # REQUIRE_ACE=1 (fail instead of skip when Ace is missing) is set on Linux only, where the libraries above are known to
      # be installed. macOS and Windows still run the Ace test (fetch-ace.sh always installs it) with Puppeteer's own Chrome,
      # which needs no extra libraries there; they just do not turn a missing install into a failure.
      - name: Require Ace (Linux)
        if: runner.os == 'Linux'
        run: echo "REQUIRE_ACE=1" >> "$GITHUB_ENV"
      - run: bash scripts/fetch-enwik8.sh
      # PDF/UA and PDF/A validation of the real Typst output (packages/export-pdf verapdf.test.ts). Linux only; elsewhere the
      # test skips. scripts/fetch-verapdf.sh installs veraPDF into tools/verapdf (needs the Java set up above); Typst and the
      # Inter fonts come from fetch-typst.sh, found through TYPST_BIN and TYPST_FONT_PATHS.
      - name: Linux veraPDF and Typst (PDF/UA validation)
        if: runner.os == 'Linux'
        run: |
          bash scripts/fetch-verapdf.sh
          bash scripts/fetch-typst.sh
          bin=$(ls "$PWD"/apps/desktop/src-tauri/binaries/typst-* | head -n 1)
          {
            echo "REQUIRE_VERAPDF=1"
            echo "VERAPDF_BIN=$PWD/tools/verapdf/verapdf"
            echo "TYPST_BIN=$bin"
            echo "TYPST_FONT_PATHS=$PWD/apps/desktop/src-tauri/binaries/fonts"
          } >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:size
      - run: pnpm test:scripts
      - run: pnpm format:check
      - run: pnpm test
      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm test:coverage:unit
          # The Playwright run merges the V8 data of ~3000 tests in one process at the end (globalTeardown), which needed
          # more than Node's default 2 GB heap (run #164 died in it); give it 60% of the machine's memory, at most 8 GB.
          mem_mb=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          heap_mb=$((mem_mb * 6 / 10)); [ "$heap_mb" -gt 8192 ] && heap_mb=8192
          echo "cores: $(nproc), memory: ${mem_mb} MB, Node heap for the e2e coverage run: ${heap_mb} MB"
          NODE_OPTIONS="--max-old-space-size=${heap_mb}" pnpm --filter @cadabracraft/desktop test:e2e:coverage
          pnpm coverage:report:js
      - name: Upload JavaScript coverage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript-coverage
          path: |
            coverage/merged/lcov.info
            coverage/merged/summary.json
            coverage/e2e/coverage-summary.json
            apps/desktop/coverage/coverage-summary.json
          if-no-files-found: error
      # The Playwright e2e suite (Chromium against the dev server, fake Tauri backend) runs once, on Linux, in the coverage step
      # above: that run executes every spec, so a second plain run and a macOS run would only repeat it.
  # Every automated accessibility gate in one place (scripts/a11y.sh) with the validators: veraPDF (PDF/UA-1, PDF/A-2b) on
  # real Typst output, Ace on the sample EPUBs, LibreOffice for docx and rtf. The stage table goes to the job summary.
  # NOT RUN YET: these steps have never run in CI (written on an unpushed branch); the first run may need fixes. The
  # a11y.sh step is required; the WebKit run (the engine of WKWebView and WebKitGTK) is continue-on-error until it has run
  # green a few times (docs/testing.md). This job replaces the old webkit-a11y job.
  a11y:
    runs-on: kinhin-container
    timeout-minutes: 60
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/puppeteer # see the js job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ports for this runner
        shell: bash
        run: |
          # The runners of one machine (names ending -r1 to -r4) share its network, so two jobs that start a server on a fixed
          # port collide ("http://localhost:1420 is already used"). One job runs per runner at a time: the runner's number
          # gives it ports of its own. Where the name has no such number (a hosted runner), the defaults stay.
          slot="${RUNNER_NAME##*-r}"; case "$slot" in ''|*[!0-9]*) slot=0 ;; esac
          echo "E2E_PORT=$((1420 + slot))" >> "$GITHUB_ENV"
          echo "TAURI_DRIVER_PORT=$((4444 + slot * 2))" >> "$GITHUB_ENV"
      - name: Linux deps (pnpm binary, LibreOffice, unzip for veraPDF)
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The runner image already has these; skip apt then, so jobs on one machine do not race on its caches.
          if dpkg -s libatomic1 unzip xz-utils libreoffice-writer >/dev/null 2>&1; then echo "system packages already installed"; exit 0; fi
          # Jobs on one machine share dpkg and /var/cache/apt: one apt at a time (the lock is held until this step ends), or a second apt deletes the first one's downloads.
          command -v flock >/dev/null 2>&1 && { exec 9>/tmp/ci-apt.lock; flock 9; }
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 unzip xz-utils && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends libreoffice-writer && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { dest: "~/setup-pnpm-${{ runner.name }}" } # one folder per runner: jobs sharing ~/setup-pnpm overwrite each other
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: pnpm }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile
      # Both browsers with their system libraries; the Chromium libraries also serve Puppeteer's Chrome for Ace.
      - name: Playwright Chromium, WebKit and its system libraries
        shell: bash
        working-directory: apps/desktop
        run: |
          # Jobs on one runner machine share /tmp and the dpkg state, and two concurrent `apt-get install` runs made dpkg lose
          # its .deb files ("cannot access archive /tmp/apt-dpkg-install-*"). Take a machine-wide lock where flock exists (not macOS).
          LOCK=""; command -v flock >/dev/null 2>&1 && LOCK="flock /tmp/ci-apt.lock"
          for i in 1 2 3 4 5; do
            $LOCK pnpm exec playwright install --with-deps chromium webkit && exit 0
            sleep $((i * 5))
          done
          exit 1
      - run: bash scripts/fetch-ace.sh
      - name: veraPDF and Typst
        run: |
          bash scripts/fetch-verapdf.sh
          bash scripts/fetch-typst.sh
          bin=$(ls "$PWD"/apps/desktop/src-tauri/binaries/typst-* | head -n 1)
          {
            echo "VERAPDF_BIN=$PWD/tools/verapdf/verapdf"
            echo "TYPST_BIN=$bin"
            echo "TYPST_FONT_PATHS=$PWD/apps/desktop/src-tauri/binaries/fonts"
          } >> "$GITHUB_ENV"
      # a11y.sh itself sets REQUIRE_VERAPDF=1 and REQUIRE_ACE=1 (and REQUIRE_SOFFICE=1 for LibreOffice) on the tools it finds.
      # It prints the stage table at the end, also when a stage fails, so tee it into the job summary.
      - name: Accessibility stages (scripts/a11y.sh --tools)
        shell: bash # explicit shell: GitHub adds `set -eo pipefail`, so tee does not hide the script's exit code
        run: |
          status=0
          bash scripts/a11y.sh --tools 2>&1 | tee a11y-stages.log || status=$?
          {
            echo '### Accessibility stages'
            echo '```'
            sed -n '/^Accessibility stages/,$p' a11y-stages.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: WebKit accessibility specs
        continue-on-error: true
        run: pnpm test:e2e:webkit
        working-directory: apps/desktop
        env: { CI: "1" }
  # Dependency licenses: the allowlist for npm and Rust, advisories, and the generated notices must be current.
  licenses:
    runs-on: kinhin-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux pnpm deps
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The runner image already has these; skip apt then, so jobs on one machine do not race on its caches.
          if dpkg -s libatomic1 build-essential >/dev/null 2>&1; then echo "system packages already installed"; exit 0; fi
          # Jobs on one machine share dpkg and /var/cache/apt: one apt at a time (the lock is held until this step ends), or a second apt deletes the first one's downloads.
          command -v flock >/dev/null 2>&1 && { exec 9>/tmp/ci-apt.lock; flock 9; }
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 build-essential && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { dest: "~/setup-pnpm-${{ runner.name }}" } # one folder per runner: jobs sharing ~/setup-pnpm overwrite each other
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: pnpm }
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs.
      - run: |
          echo "RUSTUP_HOME=$HOME/.rustup-$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-$RUNNER_NAME" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - run: pnpm install --frozen-lockfile
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo install --locked cargo-about@0.9.3 --features cli
      - run: pnpm licenses:check
      # The perf probe and the fuzz crate have their own lockfiles that `cargo deny check` above does not see.
      - run: pnpm licenses:tools-advisories
  # The real built app driven through tauri-driver (WebKitWebDriver) under a virtual display. Linux only: tauri-driver does
  # not exist for macOS, and the Windows job needs msedgedriver set up. Not a required check yet (continue-on-error): this
  # suite has not run against a real driver, so the first runs may need selector or timing fixes; it fails visibly (red
  # job) but does not block merges. Make it required once it has been green a few times (docs/testing.md).
  webdriver:
    runs-on: kinhin-container
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ports for this runner
        shell: bash
        run: |
          # The runners of one machine (names ending -r1 to -r4) share its network, so two jobs that start a server on a fixed
          # port collide ("http://localhost:1420 is already used"). One job runs per runner at a time: the runner's number
          # gives it ports of its own. Where the name has no such number (a hosted runner), the defaults stay.
          slot="${RUNNER_NAME##*-r}"; case "$slot" in ''|*[!0-9]*) slot=0 ;; esac
          echo "E2E_PORT=$((1420 + slot))" >> "$GITHUB_ENV"
          echo "TAURI_DRIVER_PORT=$((4444 + slot * 2))" >> "$GITHUB_ENV"
      - name: Linux deps (webview, WebKitWebDriver, virtual display)
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The runner image already has these; skip apt then, so jobs on one machine do not race on its caches.
          if dpkg -s libatomic1 build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zlib1g-dev webkit2gtk-driver xvfb xz-utils >/dev/null 2>&1; then echo "system packages already installed"; exit 0; fi
          # Jobs on one machine share dpkg and /var/cache/apt: one apt at a time (the lock is held until this step ends), or a second apt deletes the first one's downloads.
          command -v flock >/dev/null 2>&1 && { exec 9>/tmp/ci-apt.lock; flock 9; }
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y libatomic1 build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zlib1g-dev webkit2gtk-driver xvfb xz-utils && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { dest: "~/setup-pnpm-${{ runner.name }}" } # one folder per runner: jobs sharing ~/setup-pnpm overwrite each other
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: pnpm }
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs.
      - run: |
          echo "RUSTUP_HOME=$HOME/.rustup-$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-$RUNNER_NAME" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-typst.sh
      - run: bash scripts/fetch-sherpa.sh
      - run: bash scripts/fetch-ffmpeg.sh
      # Pinned like the other cargo tools; --locked uses the crate's own lockfile.
      # The runner image has tauri-driver 2.1.0 on PATH; install it into this job's cargo home only on a machine without it.
      - run: command -v tauri-driver || cargo install --locked tauri-driver@2.1.0
      - name: Check the WebDriver tools
        run: |
          PATH="$CARGO_HOME/bin:$PATH"
          command -v tauri-driver # tauri-driver has no --version flag: it prints its help and exits 1
          command -v xvfb-run
          command -v WebKitWebDriver
      - name: Build the app (debug, dev-automation bridge for the dialog answers)
        run: pnpm --filter @cadabracraft/desktop build:native
      - name: WebDriver e2e
        timeout-minutes: 15 # the suite takes under a minute; a hang after the tests (run #168) must fail fast, not wait for the job's timeout
        run: xvfb-run --auto-servernum pnpm test:e2e:webdriver
        env: { CI: "1" }
  rust:
    strategy:
      fail-fast: false # one OS failing must not hide how the others do
      matrix:
        # Windows is off for now: the first release is macOS and Linux (see release.yml), and the Windows runner is the
        # slowest of the three. Put `windows-latest` back in this list to test it again; the steps below that only run
        # there are still in place.
        os: [kinhin-container, kinhin-xcode]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # The runner image already has these; skip apt then, so jobs on one machine do not race on its caches. ffmpeg (with ffprobe) is for
          # the encoder tests that decode their output (audio/encode.rs); they skip without it, and then drop out of the coverage numbers.
          if dpkg -s build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zlib1g-dev ffmpeg xz-utils >/dev/null 2>&1; then echo "system packages already installed"; exit 0; fi
          # Parallel jobs can share one machine: wait for the dpkg lock and retry if another apt clobbers our downloads.
          # Jobs on one machine share dpkg and /var/cache/apt: one apt at a time (the lock is held until this step ends), or a second apt deletes the first one's downloads.
          command -v flock >/dev/null 2>&1 && { exec 9>/tmp/ci-apt.lock; flock 9; }
          for i in 1 2 3 4 5; do
            $SUDO apt-get -o DPkg::Lock::Timeout=300 update && $SUDO apt-get -o DPkg::Lock::Timeout=300 install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zlib1g-dev ffmpeg xz-utils && exit 0
            sleep $((i * 5))
          done
          exit 1
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs.
      - run: |
          echo "RUSTUP_HOME=$HOME/.rustup-$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-$RUNNER_NAME" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with: { node-version: 26 }
      - run: mkdir -p apps/desktop/dist
      - run: bash scripts/fetch-typst.sh
      - run: bash scripts/fetch-sherpa.sh
      # The M4B encoder is built from the pinned ffmpeg source (LGPL-only, minimal). Windows builds with MSYS2's MinGW gcc.
      - name: MSYS2 toolchain for ffmpeg
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          path-type: inherit
          install: make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Bundled audio encoder (ffmpeg)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-ffmpeg.sh
      - name: Bundled audio encoder (ffmpeg, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/fetch-ffmpeg.sh
      # Style is in apps/desktop/src-tauri/rustfmt.toml; run `cargo fmt` to fix.
      - name: Rust formatting (rustfmt)
        shell: bash
        run: |
          rustup component add rustfmt
          cargo fmt --check
        working-directory: apps/desktop/src-tauri
      # Lints are in Cargo.toml ([lints]): no unsafe beyond the one documented kill, no unwrap/expect/panic in production code.
      - name: Rust lints (clippy)
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      # --lib: all unit tests live in the lib; on Windows the script embeds the test manifest (see the script).
      - name: Rust tests
        shell: bash
        run: bash ../../../scripts/cargo-test.sh
        working-directory: apps/desktop/src-tauri
      - name: Rust coverage (Linux)
        if: runner.os == 'Linux'
        # The tests that decode audio with ffmpeg skip when it is missing, and a skipped test takes its lines out of the
        # numbers; with this set a missing ffmpeg fails the step instead. The table goes to the job summary.
        env: { REQUIRE_FFMPEG: "1" }
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --lib --lcov --ignore-filename-regex 'src/main.rs' > target/llvm-cov.lcov
          cargo llvm-cov report --json --ignore-filename-regex 'src/main.rs' > target/llvm-cov-summary.json
          cd ../../..
          node scripts/coverage.mjs --rust-only
        working-directory: apps/desktop/src-tauri
      - name: Upload Rust coverage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: coverage/merged/rust-lcov.info
          if-no-files-found: error
      # The bundled encoder builds a real M4B (AAC, chapters, cover) on every OS, so the Windows and Linux builds are run.
      - name: Bundled encoder (M4B)
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""; [[ $triple == *windows* ]] && exe=".exe"
          export FFMPEG_BIN="$PWD/binaries/ffmpeg-$triple$exe"
          [[ $triple == *windows* ]] && FFMPEG_BIN=$(cygpath -w "$FFMPEG_BIN")
          export REQUIRE_FFMPEG=1
          bash ../../../scripts/cargo-test.sh real_ffmpeg -- --nocapture
        working-directory: apps/desktop/src-tauri
      # End to end on every OS: download the Piper voices (148 MB) over TLS, check their hashes, and speak a sentence into
      # Opus and FLAC with the bundled engine. It is the only place the Windows and Linux engine builds are run.
      - name: Voice download and bundled engine
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""; [[ $triple == *windows* ]] && exe=".exe"
          export SHERPA_TTS_BIN="$PWD/binaries/sherpa-onnx-offline-tts-$triple$exe"
          [[ $triple == *windows* ]] && SHERPA_TTS_BIN=$(cygpath -w "$SHERPA_TTS_BIN")
          export CADABRA_NET_TESTS=full CADABRA_NET_PACKS=piper
          bash ../../../scripts/cargo-test.sh real_packs -- --nocapture
        working-directory: apps/desktop/src-tauri
