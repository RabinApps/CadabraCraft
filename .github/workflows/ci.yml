name: ci
on:
  push:
    branches: [main] # a PR branch is tested by its pull_request run; a push run as well would double the load and collide on e2e port 1420
  pull_request:
  workflow_call:
permissions:
  contents: read
# A new push to a PR cancels that PR's older run. Runs on main and runs called from release.yml are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Which jobs run: a pull request runs only what its change can reach (`changes`, scripts/affected/affected.mjs, docs/testing.md
# "Test selection"). A push to main, a release run (workflow_call) and a PR with the `full-ci` label run everything, and the
# coverage floors are checked only then. Shared steps live in .github/actions (ports, apt, setup-js, js-tools).
env:
  FULL_RUN: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
jobs:
  changes:
    runs-on: kinhin-container
    outputs:
      full: ${{ steps.select.outputs.full }}
      rust: ${{ steps.select.outputs.rust }}
      e2e: ${{ steps.select.outputs.e2e }}
      a11y: ${{ steps.select.outputs.a11y }}
      webdriver: ${{ steps.select.outputs.webdriver }}
      licenses: ${{ steps.select.outputs.licenses }}
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: "${{ github.event_name == 'pull_request' && '0' || '1' }}" }
      - uses: ./.github/actions/apt
        with: { packages: libatomic1 } # Node needs it (the container image lacks it)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - id: select
        run: node scripts/affected/affected.mjs
        env:
          AFFECTED_BASE: origin/${{ github.base_ref }}
          FORCE_FULL: ${{ env.FULL_RUN == 'true' && '1' || '0' }}
  # Fast checks that need no browser or external tool. Always runs.
  static:
    runs-on: kinhin-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-js
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:size
      - run: pnpm test:scripts
      - run: pnpm format:check
  # Vitest in the packages the change reaches (all of them on a full run), with the external tools the exporters' tests drive.
  unit:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.packages != ''
    strategy:
      fail-fast: false # one OS failing must not hide how the others do
      matrix:
        # Windows is off for now: the first release is macOS and Linux (see release.yml). macOS runs on full runs only: the pull
        # request run is the Linux one.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["kinhin-container"]' || '["kinhin-container","kinhin-xcode"]') }}
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_EPUBCHECK: "1"
      REQUIRE_ENWIK8: "1"
      # Puppeteer (Ace) keeps its Chrome per job: the Linux runners share /root, and two jobs unpacking into the same
      # ~/.cache/puppeteer at once failed with ENOENT. /tools is gitignored.
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/setup-js
        with: { java: "true" }
      - uses: ./.github/actions/js-tools
      - name: Unit tests
        shell: bash
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$FULL" = "true" ]; then pnpm test; exit; fi
          args=(); for p in ${PACKAGES//,/ }; do args+=(--filter "$p"); done
          pnpm "${args[@]}" test
  # The Playwright e2e suite (Chromium against the dev server, fake Tauri backend), in shards. No coverage here: it is
  # about three times slower per test, and its floors are checked by the `coverage` job on full runs.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: kinhin-container
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/setup-js
      - name: Playwright Chromium and its system libraries
        working-directory: apps/desktop
        run: |
          LOCK=""; command -v flock >/dev/null 2>&1 && LOCK="flock /tmp/ci-apt.lock"
          for i in 1 2 3 4 5; do
            $LOCK pnpm exec playwright install --with-deps chromium && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Playwright shard ${{ matrix.shard }} of 4
        working-directory: apps/desktop
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4 --trace off
        env: { CI: "1" }
  # Full runs only: unit and e2e coverage with the floors of scripts/coverage.mjs (docs/testing.md, "Coverage").
  coverage:
    needs: changes
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: kinhin-container
    timeout-minutes: 120
    env:
      REQUIRE_EPUBCHECK: "1"
      REQUIRE_ENWIK8: "1"
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/setup-js
        with: { java: "true" }
      - uses: ./.github/actions/js-tools
      - run: pnpm test:coverage:unit
      # The Playwright run merges the V8 data of ~3000 tests in one process at the end (globalTeardown), which needed
      # more than Node's default 2 GB heap (run #164 died in it); give it 60% of the machine's memory, at most 8 GB.
      - name: Playwright coverage run
        run: |
          mem_mb=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          heap_mb=$((mem_mb * 6 / 10)); [ "$heap_mb" -gt 8192 ] && heap_mb=8192
          echo "cores: $(nproc), memory: ${mem_mb} MB, Node heap for the e2e coverage run: ${heap_mb} MB"
          NODE_OPTIONS="--max-old-space-size=${heap_mb}" pnpm --filter @cadabracraft/desktop test:e2e:coverage
      - run: pnpm coverage:report:js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript-coverage
          path: |
            coverage/merged/lcov.info
            coverage/merged/summary.json
            coverage/e2e/coverage-summary.json
            apps/desktop/coverage/coverage-summary.json
          if-no-files-found: error
  # Every automated accessibility gate in one place (scripts/a11y.sh) with the validators: veraPDF (PDF/UA-1, PDF/A-2b) on
  # real Typst output, Ace on the sample EPUBs, LibreOffice for docx and rtf. The stage table goes to the job summary.
  # NOT RUN YET: these steps have never run in CI (written on an unpushed branch); the first run may need fixes. The
  # a11y.sh step is required; the WebKit run (the engine of WKWebView and WebKitGTK) is continue-on-error until it has run
  # green a few times (docs/testing.md). This job replaces the old webkit-a11y job.
  a11y:
    needs: changes
    if: needs.changes.outputs.a11y == 'true'
    runs-on: kinhin-container
    timeout-minutes: 120 # the Chromium and WebKit suites take about 50 min alone and about twice that beside the Coverage and WebDriver jobs on a shared machine (run #173 hit 60)
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/tools/puppeteer # see the js job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/apt
        with: { packages: libreoffice-writer, flags: --no-install-recommends }
      - uses: ./.github/actions/setup-js
        with: { java: "true" }
      # Both browsers with their system libraries; the Chromium libraries also serve Puppeteer's Chrome for Ace.
      - name: Playwright Chromium, WebKit and its system libraries
        shell: bash
        working-directory: apps/desktop
        run: |
          # Jobs on one runner machine share /tmp and the dpkg state, and two concurrent `apt-get install` runs made dpkg lose
          # its .deb files ("cannot access archive /tmp/apt-dpkg-install-*"). Take a machine-wide lock where flock exists (not macOS).
          LOCK=""; command -v flock >/dev/null 2>&1 && LOCK="flock /tmp/ci-apt.lock"
          for i in 1 2 3 4 5; do
            $LOCK pnpm exec playwright install --with-deps chromium webkit && exit 0
            sleep $((i * 5))
          done
          exit 1
      - run: bash scripts/fetch-ace.sh
      - name: veraPDF and Typst
        run: |
          bash scripts/fetch-verapdf.sh
          bash scripts/fetch-typst.sh
          bin=$(ls "$PWD"/apps/desktop/src-tauri/binaries/typst-* | head -n 1)
          {
            echo "VERAPDF_BIN=$PWD/tools/verapdf/verapdf"
            echo "TYPST_BIN=$bin"
            echo "TYPST_FONT_PATHS=$PWD/apps/desktop/src-tauri/binaries/fonts"
          } >> "$GITHUB_ENV"
      # a11y.sh itself sets REQUIRE_VERAPDF=1 and REQUIRE_ACE=1 (and REQUIRE_SOFFICE=1 for LibreOffice) on the tools it finds.
      # It prints the stage table at the end, also when a stage fails, so tee it into the job summary.
      - name: Accessibility stages (scripts/a11y.sh --tools)
        shell: bash # explicit shell: GitHub adds `set -eo pipefail`, so tee does not hide the script's exit code
        run: |
          status=0
          bash scripts/a11y.sh --tools 2>&1 | tee a11y-stages.log || status=$?
          {
            echo '### Accessibility stages'
            echo '```'
            sed -n '/^Accessibility stages/,$p' a11y-stages.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: WebKit accessibility specs
        continue-on-error: true
        run: pnpm test:e2e:webkit
        working-directory: apps/desktop
        env: { CI: "1" }
  # Dependency licenses: the allowlist for npm and Rust, advisories, and the generated notices must be current.
  licenses:
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: kinhin-container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt
        with: { packages: build-essential }
      - uses: ./.github/actions/setup-js
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs.
      - run: |
          echo "RUSTUP_HOME=$HOME/.rustup-$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-$RUNNER_NAME" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo install --locked cargo-about@0.9.3 --features cli
      - run: pnpm licenses:check
      # The perf probe and the fuzz crate have their own lockfiles that `cargo deny check` above does not see.
      - run: pnpm licenses:tools-advisories
  # The real built app driven through tauri-driver (WebKitWebDriver) under a virtual display. Linux only: tauri-driver does
  # not exist for macOS, and the Windows job needs msedgedriver set up. Not a required check yet (continue-on-error): this
  # suite has not run against a real driver, so the first runs may need selector or timing fixes; it fails visibly (red
  # job) but does not block merges. Make it required once it has been green a few times (docs/testing.md).
  webdriver:
    needs: changes
    if: needs.changes.outputs.webdriver == 'true'
    runs-on: kinhin-container
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ports
      - uses: ./.github/actions/apt
        with:
          {
            packages: build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zlib1g-dev webkit2gtk-driver xvfb xz-utils,
          }
      - uses: ./.github/actions/setup-js
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs.
      - run: |
          echo "RUSTUP_HOME=$HOME/.rustup-$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-$RUNNER_NAME" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - run: bash scripts/fetch-typst.sh
      - run: bash scripts/fetch-sherpa.sh
      - run: bash scripts/fetch-ffmpeg.sh
      # Pinned like the other cargo tools; --locked uses the crate's own lockfile.
      # The runner image has tauri-driver 2.1.0 on PATH; install it into this job's cargo home only on a machine without it.
      - run: command -v tauri-driver || cargo install --locked tauri-driver@2.1.0
      - name: Check the WebDriver tools
        run: |
          PATH="$CARGO_HOME/bin:$PATH"
          command -v tauri-driver # tauri-driver has no --version flag: it prints its help and exits 1
          command -v xvfb-run
          command -v WebKitWebDriver
      - name: Build the app (debug, dev-automation bridge for the dialog answers)
        run: pnpm --filter @cadabracraft/desktop build:native
      - name: WebDriver e2e
        timeout-minutes: 15 # the suite takes under a minute; a hang after the tests (run #168) must fail fast, not wait for the job's timeout
        run: xvfb-run --auto-servernum pnpm test:e2e:webdriver
        env: { CI: "1" }
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false # one OS failing must not hide how the others do
      matrix:
        # Windows is off for now: the first release is macOS and Linux (see release.yml), and the Windows runner is the
        # slowest of the three. Put `windows-latest` back in this list to test it again; the steps below that only run
        # there are still in place.
        os: [kinhin-container, kinhin-xcode]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ffmpeg (with ffprobe) is for the encoder tests that decode their output (audio/encode.rs); they skip without it, and then drop out of the coverage numbers.
      - uses: ./.github/actions/apt
        with:
          {
            packages: build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev zlib1g-dev ffmpeg xz-utils,
          }
      # One rustup and cargo folder per runner: jobs that share ~/.rustup break each other's toolchain installs.
      - run: |
          echo "RUSTUP_HOME=$HOME/.rustup-$RUNNER_NAME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-$RUNNER_NAME" >> "$GITHUB_ENV"
        shell: bash
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch as of 2026-10-28
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with: { node-version: 26 }
      - run: mkdir -p apps/desktop/dist
      - run: bash scripts/fetch-typst.sh
      - run: bash scripts/fetch-sherpa.sh
      # The M4B encoder is built from the pinned ffmpeg source (LGPL-only, minimal). Windows builds with MSYS2's MinGW gcc.
      - name: MSYS2 toolchain for ffmpeg
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          path-type: inherit
          install: make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Bundled audio encoder (ffmpeg)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-ffmpeg.sh
      - name: Bundled audio encoder (ffmpeg, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/fetch-ffmpeg.sh
      # Style is in apps/desktop/src-tauri/rustfmt.toml; run `cargo fmt` to fix.
      - name: Rust formatting (rustfmt)
        shell: bash
        run: |
          rustup component add rustfmt
          cargo fmt --check
        working-directory: apps/desktop/src-tauri
      # Lints are in Cargo.toml ([lints]): no unsafe beyond the one documented kill, no unwrap/expect/panic in production code.
      - name: Rust lints (clippy)
        shell: bash
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      # --lib: all unit tests live in the lib; on Windows the script embeds the test manifest (see the script).
      - name: Rust tests
        shell: bash
        run: bash ../../../scripts/cargo-test.sh
        working-directory: apps/desktop/src-tauri
      - name: Rust coverage (Linux)
        if: runner.os == 'Linux'
        # The tests that decode audio with ffmpeg skip when it is missing, and a skipped test takes its lines out of the
        # numbers; with this set a missing ffmpeg fails the step instead. The table goes to the job summary.
        env: { REQUIRE_FFMPEG: "1" }
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --lib --lcov --ignore-filename-regex 'src/main.rs' > target/llvm-cov.lcov
          cargo llvm-cov report --json --ignore-filename-regex 'src/main.rs' > target/llvm-cov-summary.json
          cd ../../..
          node scripts/coverage.mjs --rust-only
        working-directory: apps/desktop/src-tauri
      - name: Upload Rust coverage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: coverage/merged/rust-lcov.info
          if-no-files-found: error
      # The bundled encoder builds a real M4B (AAC, chapters, cover) on every OS, so the Windows and Linux builds are run.
      - name: Bundled encoder (M4B)
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""; [[ $triple == *windows* ]] && exe=".exe"
          export FFMPEG_BIN="$PWD/binaries/ffmpeg-$triple$exe"
          [[ $triple == *windows* ]] && FFMPEG_BIN=$(cygpath -w "$FFMPEG_BIN")
          export REQUIRE_FFMPEG=1
          bash ../../../scripts/cargo-test.sh real_ffmpeg -- --nocapture
        working-directory: apps/desktop/src-tauri
      # End to end on every OS: download the Piper voices (148 MB) over TLS, check their hashes, and speak a sentence into
      # Opus and FLAC with the bundled engine. It is the only place the Windows and Linux engine builds are run.
      - name: Voice download and bundled engine
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""; [[ $triple == *windows* ]] && exe=".exe"
          export SHERPA_TTS_BIN="$PWD/binaries/sherpa-onnx-offline-tts-$triple$exe"
          [[ $triple == *windows* ]] && SHERPA_TTS_BIN=$(cygpath -w "$SHERPA_TTS_BIN")
          export CADABRA_NET_TESTS=full CADABRA_NET_PACKS=piper
          bash ../../../scripts/cargo-test.sh real_packs -- --nocapture
        working-directory: apps/desktop/src-tauri
  # The one check branch protection requires: green when every job that ran passed (a skipped job is a job the change cannot reach).
  ci-ok:
    if: always()
    needs: [changes, static, unit, e2e, coverage, a11y, licenses, webdriver, rust]
    runs-on: kinhin-container
    steps:
      - name: Every needed job passed or was skipped
        env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
