name: Cargo cache
description: The cargo registry, git checkouts and installed tools, restored from the runner's cache (Blacksmith serves actions/cache from its colocated cache; elsewhere it is GitHub's backend).
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # The registry and git trees are the downloads; bin holds the cargo-installed tools (cargo-deny, cargo-about,
        # cargo-llvm-cov, tauri-driver, cargo-fuzz), which are rebuilt from source on a miss. target/ stays out: it is
        # several GB and the coverage and release builds use different profiles, so a restored tree mostly invalidates.
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
        # The three lockfiles in the repository, spelled out: the app, the fuzz crate (which `cargo fuzz` resolves through its
        # own Cargo.lock) and the perf tool that scripts/perf/huge-book.ts builds. A glob would also wander into target/ and
        # node_modules/, and an explicit list makes it obvious that the fuzz crate's lockfile is part of the key.
        key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/fuzz/Cargo.lock', 'apps/desktop/src-tauri/tools/perf/Cargo.lock') }}
        # A lockfile change misses the exact key but still restores the newest tree, so only the changed crates download.
        restore-keys: |
          cargo-${{ runner.os }}-
