name: Cargo cache
description: The cargo registry, git checkouts and installed tools, restored from the runner's cache (Blacksmith serves actions/cache from its colocated cache; elsewhere it is GitHub's backend).
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # The registry and git trees are the downloads. ~/.cargo/bin is deliberately not cached: the jobs run `cargo install`
        # (cargo-deny, cargo-about, cargo-llvm-cov, tauri-driver, cargo-fuzz), and a restored binary makes it exit with
        # "error: binary `cargo-deny` already exists in destination" (run 44527500149), while a `command -v` guard would
        # silently keep a tool at the old pinned version. target/ stays out too: it is several GB and the coverage and release
        # builds use different profiles, so a restored tree mostly invalidates.
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        # The three lockfiles in the repository, spelled out: the app, the fuzz crate (which `cargo fuzz` resolves through its
        # own Cargo.lock) and the perf tool that scripts/perf/huge-book.ts builds. A glob would also wander into target/ and
        # node_modules/, and an explicit list makes it obvious that the fuzz crate's lockfile is part of the key. The v2 prefix
        # retires the first cache generation, whose archives also carried ~/.cargo/bin and would restore it anyway.
        key: cargo2-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/fuzz/Cargo.lock', 'apps/desktop/src-tauri/tools/perf/Cargo.lock') }}
        # A lockfile change misses the exact key but still restores the newest tree, so only the changed crates download.
        restore-keys: |
          cargo2-${{ runner.os }}-
