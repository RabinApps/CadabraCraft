name: Set up JavaScript
description: pnpm, Node, optionally Java, and a frozen install.
inputs:
  java:
    description: Set up Java 17 (EPUBCheck, veraPDF).
    default: "false"
runs:
  using: composite
  steps:
    # The standalone pnpm binary needs libatomic, which the container image lacks; jlink (--strip-debug) runs objcopy, from binutils; unzip unpacks the veraPDF installer.
    - uses: ./.github/actions/apt
      with: { packages: libatomic1 binutils unzip xz-utils }
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with: { dest: "~/setup-pnpm-${{ runner.name }}" } # one folder per runner: jobs sharing ~/setup-pnpm overwrite each other
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: { node-version: 26, cache: pnpm }
    - if: inputs.java == 'true'
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with: { distribution: temurin, java-version: 17 }
    - shell: bash
      run: pnpm install --frozen-lockfile
