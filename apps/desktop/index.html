<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CadabraCraft</title>
    <script>
      try {
        var t = localStorage.getItem("cadabracraft.theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : "system";
      } catch (e) {
        document.documentElement.dataset.theme = "system";
      }
      try {
        var l = localStorage.getItem("cadabracraft.locale");
        if (l) {
          document.documentElement.lang = l === "pseudo" ? "en" : l;
          document.documentElement.dir = /^(he|ar|fa|ur)/.test(l) ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
