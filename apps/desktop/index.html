<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CadabraCraft</title>
    <script>
      try {
        var t = localStorage.getItem("cadabracraft.theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
      try {
        var l = localStorage.getItem("cadabracraft.locale");
        if (l) {
          document.documentElement.lang = l === "pseudo" ? "en" : l;
          document.documentElement.dir = /^(he|ar|fa|ur)/.test(l) ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
