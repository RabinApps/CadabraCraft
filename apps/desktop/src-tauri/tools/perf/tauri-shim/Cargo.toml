# Stand-in for the `tauri` crate, named `tauri` so the app sources compile unchanged: they only use `tauri::Url` and `tauri::Error`.
# Lets perfprobe and the fuzz targets build without the real tauri (and its sidecar-binary build script).
[package]
name = "tauri"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
url = "2"
