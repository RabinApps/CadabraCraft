[package]
name = "cadabracraft-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: cargo-fuzz builds with nightly and sanitizer flags, which must not touch the app's build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# Dependencies of the app sources included by src/lib.rs (same versions as ../Cargo.toml).
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.42"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tauri = { path = "../tools/perf/tauri-shim" }

[lib]
path = "src/lib.rs"

[profile.release]
debug = 1

[[bin]]
name = "docx_archive"
path = "fuzz_targets/docx_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_xml"
path = "fuzz_targets/docx_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_import"
path = "fuzz_targets/docx_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wav"
path = "fuzz_targets/wav.rs"
test = false
doc = false
bench = false

[[bin]]
name = "font_family"
path = "fuzz_targets/font_family.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_size"
path = "fuzz_targets/image_size.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typst_frame"
path = "fuzz_targets/typst_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_resolve"
path = "fuzz_targets/project_resolve.rs"
test = false
doc = false
bench = false
