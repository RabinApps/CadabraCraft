[package]
name = "cadabracraft"
version = "0.1.0"
license-file = "../../../LICENSE"
edition = "2021"
# Built and tested with 1.99 (the code uses `slice::as_chunks`, `is_multiple_of`, `Option::is_none_or`); older compilers are not tried.
rust-version = "1.99"

# Memory-safety and panic policy (docs/architecture.md, "Rust standards"): no unsafe except the one documented `kill` in
# platform/sidecar.rs, and no unwrap/expect/panic in production code (tests are exempt, see clippy.toml). Indexing and `as`
# casts are not linted: the audio DSP code uses both on values bounded by construction, and the untrusted-input parsers
# already use `get`/`checked_*`; the fuzz targets and the perf harness cover the rest.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[lib]
name = "cadabracraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Dev-only automation for AI agents (see docs/agent-testing.md). Never enabled in release builds.
dev-automation = ["dep:tauri-plugin-mcp-bridge"]

[dependencies]
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
sha2 = "0.11"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-dialog = "2"
notify = "8"
notify-debouncer-mini = "0.7.0"
tempfile = "3"
flacenc = "0.5.1"
opus-rs = "0.1.40"
ogg = "0.9.2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
# Voice download. Both are already in the build through the updater plugin, with these same features.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# .docx import (src/import_docx). zip: deflate only (what Word writes), no encryption, no other codecs, no time. quick-xml: reader only.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip enables flate2 without a backend; pick one here so no target depends on another crate (png) doing it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42"

[dev-dependencies]
# Mock runtime for testing the command layer through the IPC (tauri::test). Dev only: release builds do not get it.
tauri = { version = "2", features = ["test"] }
