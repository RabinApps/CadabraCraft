[package]
name = "cadabracraft"
version = "0.0.0"
edition = "2021"

[lib]
name = "cadabracraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[dev-dependencies]
tempfile = "3"
