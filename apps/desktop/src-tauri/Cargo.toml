[package]
name = "cadabracraft"
version = "0.0.0"
license-file = "../../../LICENSE"
edition = "2021"

[lib]
name = "cadabracraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Dev-only automation for AI agents (see docs/agent-testing.md). Never enabled in release builds.
dev-automation = ["dep:tauri-plugin-mcp-bridge"]

[dependencies]
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-dialog = "2"
notify = "8"
notify-debouncer-mini = "0.7.0"
tempfile = "3"
flacenc = "0.5.1"
opus-rs = "0.1.40"
ogg = "0.9.2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
# Voice download. Both are already in the build through the updater plugin, with these same features.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
# Mock runtime for testing the command layer through the IPC (tauri::test). Dev only: release builds do not get it.
tauri = { version = "2", features = ["test"] }
